<h3 class="card-header">Verify Email</h3>
<div class="card-body">
    <div *ngIf="emailStatus === EmailStatus.Verifying" class="text-center py-5">
        <span class="spinner-border spinner-border-lg align-center"></span>
    </div>
    <div *ngIf="emailStatus === EmailStatus.Failed" class="text-center py-5">
        Verification failed, you can also verify your account using the <a routerLink="../login">login page</a>.
    </div>
</div>
